services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - sicad_network

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: always
    ports:
      - "6380:6380"
    volumes:
      - redis_data:/data
    networks:
      - sicad_network

  backend-1:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend-1
    restart: always
    depends_on:
      - postgres
      - redis
    env_file: .env
    ports:
      - "5001:5000"
    networks:
      - sicad_network

  backend-2:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend-2
    restart: always
    depends_on:
      - postgres
      - redis
    env_file: .env
    ports:
      - "5002:5000"
    networks:
      - sicad_network

  nginx:
    image: nginx:alpine
    container_name: load-balancer
    restart: always
    depends_on:
      - backend-1
      - backend-2
    ports:
      - "8080:8080"
    networks:
      - sicad_network

  bore:
    image: ekzhang/bore:latest
    container_name: sicad_bore
    command: "local --local-host backend-1 --to bore.pub -p 29664 5000"
    restart: always
    depends_on:
      - backend-1
    networks:
      - sicad_network

volumes:
  postgres_data:
  redis_data:

networks:
  sicad_network:
    driver: bridge
